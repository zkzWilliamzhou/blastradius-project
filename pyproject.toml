[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blastradius"
version = "1.0.0"
description = "Score the blast radius of a shell command before an AI agent runs it. Pure stdlib, no execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BlastRadius contributors" }]
keywords = ["security", "ai-agents", "shell", "guardrails", "static-analysis", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Shells",
]

[project.scripts]
br = "blastradius.cli:main"
blastradius = "blastradius.cli:main"

[tool.setuptools]
packages = ["blastradius"]

[tool.setuptools.package-data]
blastradius = ["py.typed"]
